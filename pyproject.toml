[project]
name = "portta-multiviewer-control"
version = "0.1.0"
description = "Utility for controlling PORTTA 4x2 multiviewer via its USB CDC RS232 serial protocol"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyserial>=3.5",
]
license = "0BSD"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "server",
    "hdmi_matrix",
    "hdmi_matrix_status",
    "status_cache"
]
