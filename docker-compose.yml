services:
  flask-app:
    build: .
    container_name: hdmi-matrix-control
    ports:
      - "${FLASK_PORT:-5000}:5000"
    devices:
      - ${HDMI_MATRIX_SERIAL_PORT:-/dev/ttyACM0}:/dev/ttyACM0
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
    volumes:
      - .:/app
    restart: unless-stopped
